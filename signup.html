<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title data-en="Sign Up | KeyTheory" data-et="Loo konto | KeyTheory">Sign Up | KeyTheory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="signup-page">
    <header class="site-header">
      <a class="brand" href="index.html#home" aria-label="KeyTheory home" data-en-aria-label="KeyTheory home" data-et-aria-label="KeyTheory avaleht">
        <img class="brand-mark" src="assets/kt-logo.png" alt="" />
        <span>KEYTHEORY</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation" data-en-aria-label="Main navigation" data-et-aria-label="Peamenüü">
        <a class="nav-link is-current" href="signup.html" aria-current="page" data-en="Account" data-et="Konto">Account</a>
        <a class="nav-link" href="index.html#home" data-en="Home" data-et="Avaleht">Home</a>
        <a class="nav-link" href="learn.html" data-en="Learn" data-et="Õpi">Learn</a>
        <a class="nav-link" href="index.html#piano-lab" data-en="Piano Lab" data-et="Klaverilabor">Piano Lab</a>
        <a class="practice-link" href="#practice" data-en="Practice" data-et="Harjuta">Practice</a>
        <button class="language-toggle" type="button" data-language-toggle aria-label="Switch language to Estonian" data-en-aria-label="Switch language to Estonian" data-et-aria-label="Vaheta keeleks inglise keel" aria-pressed="false">ET</button>
      </nav>
    </header>

    <main class="signup-main">
      <section class="signup-card" aria-label="Account access" data-en-aria-label="Account access" data-et-aria-label="Konto kasutamine">
        <div class="signup-tabs" role="tablist" aria-label="Account access options" data-en-aria-label="Account access options" data-et-aria-label="Konto valikud">
          <button class="signup-tab" type="button" role="tab" aria-selected="false" data-account-mode="login" data-en="Login" data-et="Logi sisse">Login</button>
          <button class="signup-tab is-selected" type="button" role="tab" aria-selected="true" data-account-mode="signup" data-en="Sign Up" data-et="Loo konto">Sign Up</button>
        </div>

        <form class="signup-form" data-signup-form>
          <label class="visually-hidden" for="signup-email" data-en="Email" data-et="E-post">Email</label>
          <input id="signup-email" name="email" type="email" placeholder="Email" data-en-placeholder="Email" data-et-placeholder="E-post" autocomplete="email" required />
          <label class="visually-hidden" for="signup-password" data-en="Password" data-et="Parool">Password</label>
          <input id="signup-password" name="password" type="password" placeholder="Password" data-en-placeholder="Password" data-et-placeholder="Parool" autocomplete="new-password" required />
          <button class="signup-submit" type="submit" data-en="Create Account" data-et="Loo konto">Create Account</button>
          <button class="google-signin" type="button">
            <img src="assets/google-mark.png" alt="" />
            <span data-en="Continue with Google" data-et="Jätka Google'iga">Continue with Google</span>
          </button>
          <p class="signup-status" data-signup-status role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <div class="footer-brand">
          <a class="footer-brand-link" href="index.html#home" aria-label="KeyTheory home">
            <img src="assets/kt-logo.png" alt="" />
            <span>KEYTHEORY</span>
          </a>
          <p data-en="Master music theory" data-et="Valda muusikateooriat">Master music theory</p>
        </div>

        <nav class="footer-column" aria-label="Learn" data-en-aria-label="Learn" data-et-aria-label="Õpi">
          <h2 data-en="Learn" data-et="Õpi">Learn</h2>
          <a href="learn.html#learn" data-en="Chords &amp; Harmony" data-et="Akordid ja harmoonia">Chords &amp; Harmony</a>
          <a href="learn.html#learn" data-en="Scales &amp; Keys" data-et="Heliredelid ja helistikud">Scales &amp; Keys</a>
          <a href="learn.html#learn" data-en="Rhythm" data-et="Rütm">Rhythm</a>
          <a href="index.html#piano-lab" data-en="Piano Lab" data-et="Klaverilabor">Piano Lab</a>
        </nav>

        <nav class="footer-column" aria-label="Company" data-en-aria-label="Company" data-et-aria-label="Ettevõte">
          <h2 data-en="Company" data-et="Ettevõte">Company</h2>
          <a href="#about" data-en="About Us" data-et="Meist">About Us</a>
          <a href="#contact" data-en="Contact" data-et="Kontakt">Contact</a>
          <a href="#privacy" data-en="Privacy Policy" data-et="Privaatsuspoliitika">Privacy Policy</a>
          <a href="#terms" data-en="Terms &amp; Service" data-et="Kasutustingimused">Terms &amp; Service</a>
        </nav>
      </div>
      <div class="footer-bottom">
        <p data-en="© 2026 KeyTheory. All rights reserved." data-et="© 2026 KeyTheory. Kõik õigused kaitstud.">© 2026 KeyTheory. All rights reserved.</p>
        <div class="footer-languages" aria-label="Choose language" data-en-aria-label="Choose language" data-et-aria-label="Vali keel">
          <button type="button" data-language-choice="en" aria-pressed="true">EN</button>
          <span aria-hidden="true"></span>
          <button type="button" data-language-choice="et" aria-pressed="false">ET</button>
        </div>
      </div>
    </footer>
  </body>
</html>
